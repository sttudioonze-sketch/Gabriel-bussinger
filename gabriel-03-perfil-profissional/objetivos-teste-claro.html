<!doctype html><html lang="pt-BR"><meta charset="utf-8"><script>if(new URLSearchParams(location.search).has("embedded"))document.documentElement.classList.add("embedded")</script><meta name="viewport" content="width=device-width"><title>Gabriel Bussinger | Dados pessoais</title><style>
  /* Filosofia de trabalho, Gabriel Bussinger: identidade em identidade.md */
  @property --luz{syntax:"<percentage>";inherits:true;initial-value:-30%}
  :root{
    --noite:#001d35;        /* azul-marinho dominante (paleta do cliente, 2026-11-04) */
    --ciano:#3affe7;        /* aqua: o destaque único */
    --ciano-fundo:#07475C;
    --fundo-luz:#06325A;    /* brilho atrás dele */
    --giz:#EEEEEE;
    --linha:#EEEEEEA6; /* o claro a 65%, para texto de apoio */
    --grafite:#1B2126; /* chão abaixo do meio-campo e moldura */
    --display:"League Gothic","Arial Narrow",sans-serif;
    --palavra:"Smooch Sans","League Gothic","Arial Narrow",sans-serif;
    --texto:"Archivo",Arial,sans-serif;
    --margem:96px;
    /* vidro */
    --vidro:linear-gradient(155deg,#ffffff1f,#ffffff08 45%,#3affe70d);
    --vidro-borda:#ffffff2e;
    --vidro-brilho:inset 0 1px 0 #ffffff40,inset 0 -1px 0 #ffffff0d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--grafite);height:100%}
  body{overflow:hidden}
  .palco{position:fixed;inset:0;display:grid;place-items:center}
  .export .palco{position:static;display:block}

  .slide{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;flex:none;display:none;
    transform-origin:center;color:var(--giz);font-family:var(--texto);
  }
  .slide.ativo{display:block}
  .capa{
    /* Estádio à noite, gerado por ferramentas/estadio.py; o gradiente escurece o topo para o cabeçalho */
    background:
      linear-gradient(180deg,#00060fcc 0%,#00060f00 22%),
      url(assets/estadio.jpg) center/cover no-repeat,
      #000a16;
  }
  .export .slide{position:relative;left:auto;top:auto;transform:none!important}
  .export *{transition:none!important}


  /* Topo */
  .topo{position:absolute;z-index:4;top:38px;left:var(--margem);right:var(--margem);display:flex;justify-content:space-between;align-items:center}
  .topo p{font-size:17px;line-height:1.35;color:var(--linha)}
  .topo p b{display:block;font-weight:600;color:var(--giz)}

  /* Seletor de idiomas, em vidro */
  .idiomas{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--vidro);border:1px solid var(--vidro-borda);box-shadow:var(--vidro-brilho),0 10px 30px -12px #0008;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
  .idiomas button{font:600 15px/1 var(--texto);font-stretch:112%;color:var(--linha);background:transparent;border:0;border-radius:999px;min-width:56px;height:40px;padding:0 14px;cursor:pointer;transition:background .2s,color .2s}
  .idiomas button:hover{color:var(--giz)}
  .idiomas button[aria-pressed=true]{background:#3affe724;color:var(--ciano);box-shadow:inset 0 0 0 1px #3affe755}
  .idiomas button:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}

  /* A palavra, com luz suave */
  .palavra{position:absolute;z-index:1;left:0;right:0;top:64px;text-align:center;white-space:nowrap;pointer-events:none}
  .palavra > span{
    position:relative;display:inline-block;
    font-family:var(--palavra);font-weight:900;font-synthesis:none;text-transform:uppercase;
    line-height:.8;letter-spacing:.012em;padding-top:.02em;
    transform:scaleY(1.28);transform-origin:top center;
  }
  /* FILOSOFÍA: o acento do Í precisa de espaço no alto */
  html[lang=es] .palavra{top:104px}
  .palavra .letras{
    background:
      /* reflexo: faixa larga e fraca, com queda suave nas bordas */
      linear-gradient(108deg,transparent calc(var(--luz) - 24%),#ebfffb0a calc(var(--luz) - 15%),#ebfffb21 calc(var(--luz) - 8%),#f5fffd3d var(--luz),#ebfffb21 calc(var(--luz) + 8%),#ebfffb0a calc(var(--luz) + 15%),transparent calc(var(--luz) + 24%)),
      /* luz difusa vinda de cima */
      radial-gradient(ellipse 55% 80% at 50% -14%,#ebfffb52 0%,#ebfffb00 100%),
      linear-gradient(180deg,var(--ciano) 0%,var(--ciano) 22%,#21b8ab 50%,var(--ciano-fundo) 72%,#012339 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:luz 13s cubic-bezier(.42,0,.3,1) 1.5s infinite;
  }
  /* brilho difuso por trás das letras */
  .palavra .brilho{position:absolute;inset:-120px;padding:calc(.06em + 120px) 120px 120px;color:var(--ciano);opacity:.4;filter:blur(42px);
    -webkit-mask-image:linear-gradient(180deg,#000 35%,transparent 78%);mask-image:linear-gradient(180deg,#000 35%,transparent 78%)}
  @keyframes luz{0%{--luz:-30%}62%{--luz:130%}100%{--luz:130%}}
  .export .palavra .letras{animation:none;--luz:70%}
  @media (prefers-reduced-motion:reduce){.palavra .letras{animation:none}}

  .halo{position:absolute;z-index:0;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 620px 360px at 84% 8%,#3affe726,transparent 70%),radial-gradient(ellipse 620px 360px at 14% 8%,#3affe71a,transparent 70%)}

  /* Ele */
  .retrato{
    position:absolute;z-index:2;top:64px;left:50%;height:1560px;transform:translateX(-50%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 19%,#000 100%),linear-gradient(180deg,#000 100%,#000 100%);
    -webkit-mask-composite:source-in;mask-composite:intersect;
    filter:saturate(.9) contrast(1.03) drop-shadow(0 0 16px #0b0f1299);
  }
  /* Sombra projetada dele sobre a palavra e o fundo */
  .retrato-sombra{
    position:absolute;z-index:2;top:64px;left:50%;height:1560px;pointer-events:none;
    transform:translate(calc(-50% - 34px),24px);
    filter:brightness(0) blur(30px);opacity:.74;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 19%,#000 100%);mask-image:linear-gradient(90deg,transparent 0,#000 19%,#000 100%);
  }
  .sombra-chao{position:absolute;z-index:2;left:0;right:0;bottom:0;height:220px;background:linear-gradient(0deg,#0b0f12f2 0%,#1b2126b0 30%,transparent)}

  /* Nome, sobre a base da palavra */
  .nome{position:absolute;z-index:3;left:var(--margem);top:520px;width:600px}
  .nome h1{position:relative;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:134px;line-height:.86;letter-spacing:.01em}
  .nome h1 > span{display:block}
  .n-sombra,.n-aresta{position:absolute;inset:0}
  .n-sombra{color:#0b0f12;opacity:.3;filter:blur(20px);transform:translateY(10px)}
  .n-vidro{
    color:transparent;
    background:linear-gradient(172deg,#fffffffa 0%,#ffffffee 40%,#ffffffd6 70%,#e9fffae0 100%);
    -webkit-backdrop-filter:blur(14px) saturate(170%) brightness(1.2);backdrop-filter:blur(14px) saturate(170%) brightness(1.2);
    -webkit-mask-image:linear-gradient(#000,#000);-webkit-mask-clip:text;mask-clip:text;
  }
  .n-aresta{color:transparent;-webkit-text-stroke:1.2px #ffffff;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#0008 45%,#0003 100%);mask-image:linear-gradient(180deg,#000 0%,#0008 45%,#0003 100%)}
  .cargo{font-size:24px;font-weight:600;font-stretch:112%;color:var(--ciano);margin-top:26px}
  .nome p{font-size:21px;line-height:1.45;color:#EEEEEEDE;margin-top:10px;text-wrap:balance}

  /* Licenças, num painel de vidro */
  .licencas{position:absolute;z-index:3;right:var(--margem);top:486px;width:410px;list-style:none;display:grid;gap:14px}
  .licencas li{
    display:grid;grid-template-columns:64px 1fr;align-items:center;gap:22px;padding:18px 26px;border-radius:20px;
    background:var(--vidro);border:1px solid var(--vidro-borda);
    box-shadow:var(--vidro-brilho),0 24px 50px -28px #000c;
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
  }
  .licencas .selo{height:60px;display:grid;place-items:center}
  .licencas .selo img{max-height:60px;max-width:64px;object-fit:contain}
  .licencas strong{display:block;font-size:24px;font-weight:600;font-stretch:112%;color:var(--giz)}
  .licencas span{display:block;font-size:18px;color:var(--linha);margin-top:4px}

  .marca-pp{height:42px;width:auto;display:block;filter:brightness(0) invert(1)} /* logo em branco */
  .rodape{position:absolute;z-index:4;left:var(--margem);right:var(--margem);bottom:34px;display:flex;justify-content:space-between;align-items:center;font-size:17px;color:var(--linha)}

  /* ---------- Etiqueta, rodapé e marca dos slides internos ---------- */
  .etiqueta{position:absolute;z-index:3;left:var(--margem);top:78px;display:flex;align-items:center;gap:26px}
  /* Etiqueta em vidro: brilho de aresta em gradiente, reflexo na metade de cima e uma luz aqua atrás para o desfoque ter cor */
  .etiqueta::before{content:"";position:absolute;z-index:-1;left:-60px;top:-46px;width:640px;height:170px;pointer-events:none;
    background:radial-gradient(closest-side,#3affe72e,#3affe70a 60%,transparent);filter:blur(6px)}
  .pill{position:relative;display:inline-flex;align-items:center;gap:18px;padding:8px 8px 8px 30px;border-radius:999px;
    background:linear-gradient(135deg,#ffffff2b 0%,#ffffff12 36%,#ffffff06 62%,#3affe712 100%);
    box-shadow:inset 0 1px 0 #ffffff59,inset 0 -1px 0 #ffffff12,inset 0 0 22px #ffffff0a,0 20px 44px -20px #000000d9,0 2px 8px -2px #00000066;
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    font-family:var(--texto);font-weight:600;font-stretch:112%;text-transform:uppercase;font-size:24px;line-height:1;letter-spacing:.07em;color:var(--giz)}
  .pill::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
    background:linear-gradient(135deg,#ffffffb3 0%,#ffffff2e 30%,#ffffff0d 55%,#ffffff1f 75%,#3affe799 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .pill::after{content:"";position:absolute;left:14px;right:14px;top:1px;height:46%;border-radius:999px 999px 50% 50%/999px 999px 100% 100%;pointer-events:none;
    background:linear-gradient(180deg,#ffffff24,#ffffff00);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
  .pill .sec{position:relative;z-index:1;border-radius:999px;padding:11px 24px 10px;color:var(--noite);
    background:linear-gradient(180deg,#8dfff2 0%,#3affe7 48%,#22cdbb 100%);
    box-shadow:inset 0 1px 0 #ffffffc0,inset 0 -2px 5px #00715f4d,0 0 24px #3affe74d,0 6px 14px -6px #3affe799}
  .etiqueta .sub{font-size:24px;font-weight:600;font-stretch:112%;color:var(--linha)}
  .interno .rodape{align-items:center}
  .assina{display:flex;align-items:center;gap:22px}
  .selos{display:flex;align-items:center;gap:16px;padding-right:22px;border-right:1px solid #eeeeee30}
  .selos img{height:30px;width:auto;max-width:46px;object-fit:contain}
  .assina-t{font-size:16px;font-weight:600;font-stretch:112%;line-height:1;color:var(--linha)}
  .pag{font-weight:600;font-stretch:112%;font-size:17px;color:var(--linha);font-variant-numeric:tabular-nums}
  .marca-lado{position:absolute;z-index:4;top:60px;right:54px;width:26px;height:92px}
  .marca-lado img{position:absolute;left:50%;top:50%;height:26px;width:auto;transform:translate(-50%,-50%) rotate(-90deg);filter:brightness(0) invert(1)}

  /* ---------- Slides internos ---------- */
  /* Fundo interno: o mesmo estádio, desfocado e escurecido, para o vidro ter o que desfocar */
  .interno{background:#000a16}
  .interno::before,.interno::after{content:"";position:absolute;z-index:0;pointer-events:none}
  .interno::before{inset:-60px;background:url(assets/estadio-interno.jpg) center/100% 100% no-repeat}   /* estádio com blur 18px e saturação .9 já aplicados (ferramentas/fundo_interno.py) */
  .interno::after{inset:0;background:
      radial-gradient(ellipse 900px 760px at 80% 60%,#06325A66,transparent 70%),
      linear-gradient(180deg,#00060feb 0%,#000a16cc 50%,#00060fe6 100%)}
  .titulo{
    position:absolute;z-index:2;left:var(--margem);top:176px;
    font-family:var(--palavra);font-weight:900;font-synthesis:none;text-transform:uppercase;
    font-size:150px;line-height:.86;letter-spacing:.01em;
    transform:scaleY(1.18);transform-origin:top left;
    background:linear-gradient(180deg,var(--ciano) 0%,var(--ciano) 40%,#21b8ab 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-wrap:balance;
  }

  /* Visão: título e cinco pilares à esquerda, ele falando à direita */
  .visao .titulo{width:980px}
  .pilares{position:absolute;z-index:2;left:var(--margem);top:560px;width:920px;list-style:none}
  .pilares li{display:grid;grid-template-columns:40px 1fr;gap:24px;align-items:center;padding:19px 0;border-top:1px solid #eeeeee1c;font-size:31px;line-height:1.2;font-weight:500}
  .pilares li:last-child{border-bottom:1px solid #eeeeee1c}
  .pilares svg{width:32px;height:32px;fill:none;stroke:var(--ciano);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  /* As duas camadas da foto ficam onde o PDF as põe (1440 → 1920 px): ambiente atrás, recorte na frente, sem sombra */
  .foto-fundo,.foto{position:absolute;z-index:1;left:1052px;top:-101px;width:922px;height:auto;pointer-events:none}
  /* No PDF um véu branco (camada 2228) esconde a borda esquerda do ambiente. Aqui a própria camada se apaga, como o véu faria. */
  .foto-fundo{-webkit-mask-image:linear-gradient(90deg,transparent 0%,#0000004d 15%,#0000009c 30%,#000000cc 45%,#000000f0 60%,#000 72%);mask-image:linear-gradient(90deg,transparent 0%,#0000004d 15%,#0000009c 30%,#000000cc 45%,#000000f0 60%,#000 72%)}


  /* Grifo: um traço fino de caneta logo abaixo da palavra, sem passar por cima das letras */
  mark.grifo{color:inherit;background-color:transparent;padding-bottom:.2em;
    background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 12' preserveAspectRatio='none'><path fill='%233affe7' d='M3 6.2C70 3.6 170 5.4 250 4.3S360 3.2 397 5L396 8.1C340 9.4 262 7.6 182 8.6S62 9.8 4 9.2Z'/></svg>");
    background-repeat:no-repeat;background-position:0 100%;background-size:100% .13em;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .slide.ativo mark.grifo{animation:grifar .6s cubic-bezier(.55,.05,.35,1) var(--d,0s) both}
  @keyframes grifar{from{background-size:0% .13em}}
  .export mark.grifo{animation:none!important}
  @media (prefers-reduced-motion:reduce){mark.grifo{animation:none!important}}

  /* Crenças: três ambientes por slide, em cartões de vidro */
  .crencas .titulo{font-size:132px}
  .cartoes{position:absolute;z-index:2;left:var(--margem);right:var(--margem);top:372px;bottom:118px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .cartao{
    display:flex;flex-direction:column;padding:38px 40px 34px;border-radius:24px;
    background:var(--vidro);border:1px solid var(--vidro-borda);
    box-shadow:var(--vidro-brilho),0 30px 60px -36px #000d;
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
  }
  .cartao h3{font-size:31px;line-height:1.15;font-weight:600;font-stretch:112%;color:var(--giz)}
  .cartao .qual{font-size:19px;font-weight:600;font-stretch:112%;color:var(--ciano);margin-top:8px}
  .cartao p{font-size:22px;line-height:1.5;color:#eeeeeebd;margin-top:20px;hyphens:manual;text-wrap:pretty}
  .cartao p b{font-weight:600;color:var(--giz)}
  .cartao blockquote{margin-top:auto;padding-top:22px;background:linear-gradient(#3affe738,#3affe738) 0 0/100% 1px no-repeat;font-size:22px;line-height:1.38;font-weight:500;color:var(--giz);text-wrap:pretty}
  .cartao blockquote::before{content:"\201C";display:block;height:30px;font-family:var(--texto);font-weight:600;font-size:64px;line-height:.85;color:var(--ciano)}


  /* ---------- Transições dos cartões ----------
     Entrada em Crenças: o vidro de cada cartão se forma em sequência e o fio da frase é desenhado.
     Do 3 para o 4 (e de volta): os cartões ficam no lugar e só o conteúdo troca. */
  .slide{z-index:0}
  .entrada .cartao,.entrada .surge{animation:vidro .7s cubic-bezier(.2,.7,.2,1) calc(.1s + var(--i,0) * .1s) both}
  @keyframes vidro{from{opacity:0;translate:0 14px;-webkit-backdrop-filter:blur(0) saturate(100%);backdrop-filter:blur(0) saturate(100%)}}
  .entrada .cartao blockquote{animation:fio .6s cubic-bezier(.55,.05,.35,1) calc(.7s + var(--i,0) * .1s) both}
  @keyframes fio{from{background-size:0% 1px}}

  .slide.saindo{display:block;z-index:2;background:none;pointer-events:none}
  .slide.saindo::before,.slide.saindo::after{display:none}
  .saindo .etiqueta,.saindo .rodape,.saindo .marca-lado{visibility:hidden}
  .saindo .cartao{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .saindo .titulo,.saindo .cartao>*{animation:sair .3s ease-in both}
  @keyframes sair{to{opacity:0;translate:0 -6px}}
  .troca .titulo,.troca .cartao>*{animation:entrar .45s cubic-bezier(.2,.7,.2,1) .18s both}
  .troca .cartao:nth-child(2)>*{animation-delay:.24s}
  .troca .cartao:nth-child(3)>*{animation-delay:.3s}
  @keyframes entrar{from{opacity:0;translate:0 8px}}

  /* ---------- Trilhas em vez de trilhos: seis cartões em volta da montanha, como no PDF ---------- */
  .trilhas .titulo{font-size:66px;top:152px}
  .trilhas .arte{position:absolute;z-index:1;inset:0;width:1920px;height:1080px;pointer-events:none}
  .trilhas .caminho{filter:drop-shadow(0 0 6px #3affe7aa)}
  .trilhas .pano{filter:drop-shadow(0 0 14px #3affe766)}
  .trilhas .mapa{position:absolute;z-index:2;inset:0;pointer-events:none}
  .trilhas .cartao{position:absolute;width:650px;padding:20px 30px 18px;border-radius:20px;pointer-events:auto}
  .trilhas .cartao h3{display:flex;align-items:center;gap:12px;font-size:21px}
  .trilhas .ic{flex:none;width:26px;height:26px}
  .trilhas .cartao p{font-size:16.5px;line-height:1.42;margin-top:10px}
  .trilhas .cartao blockquote{margin-top:12px;padding-top:10px;font-size:16.5px;line-height:1.4}
  .trilhas .cartao blockquote::before{content:"\201C";display:inline;height:auto;font-size:1em;line-height:inherit;margin-right:.08em}
  .trilhas .cartao blockquote::after{content:"\201D";color:var(--ciano);font-weight:600;margin-left:.04em}

  /* Entrada: o vidro se forma na ordem de leitura, a trilha é desenhada do pé ao cume,
     a bandeira sobe e, por último, o trilho reto é riscado. */
  .trilhas.entrada .monte,.trilhas.entrada .trilho-reto{animation:surgir .9s ease .05s both}
  @keyframes surgir{from{opacity:0}}
  .trilhas.entrada .tr-guia{stroke-dasharray:1;animation:tracar 1.5s cubic-bezier(.45,.1,.3,1) .55s both}
  @keyframes tracar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .trilhas.entrada .mastro{transform-box:fill-box;transform-origin:50% 100%;animation:hastear .45s cubic-bezier(.2,.7,.2,1) 1.95s both}
  @keyframes hastear{from{transform:scaleY(0)}}
  .trilhas.entrada .pano{transform-box:fill-box;transform-origin:0 50%;animation:abrir .5s cubic-bezier(.2,.7,.2,1) 2.3s both}
  @keyframes abrir{from{opacity:0;transform:scaleX(.1)}}
  .trilhas.entrada .risco path{stroke-dasharray:1;animation:tracar .32s cubic-bezier(.55,.05,.35,1) 2.55s both}
  .trilhas.entrada .risco .r2{animation-delay:2.85s}

  /* ---------- Slides densos (composição do PDF): título compacto e cartões menores ---------- */
  .titulo.compacto{font-size:66px;top:152px}
  .denso .cartao{padding:20px 26px 18px;border-radius:20px}
  .denso .cartao h3{font-size:21px}
  .denso .cartao .qual{font-size:16px;margin-top:4px}
  .denso .cartao p{font-size:16.5px;line-height:1.42;margin-top:10px}
  .denso .cartao blockquote{margin-top:12px;padding-top:10px;font-size:16.5px;line-height:1.4}
  .denso .cartao blockquote::before{content:"\201C";display:inline;height:auto;font-size:1em;line-height:inherit;margin-right:.08em}
  .denso .cartao blockquote::after{content:"\201D";color:var(--ciano);font-weight:600;margin-left:.04em}
  .vidro{background:var(--vidro);border:1px solid var(--vidro-borda);box-shadow:var(--vidro-brilho),0 30px 60px -36px #000d;
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
