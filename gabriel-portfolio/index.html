<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabriel Bussinger | Portfólio profissional</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a132b;color:#f5f5f5;font:500 13px system-ui}
iframe{width:100%;height:100svh;display:block;border:0}
nav{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid #d7edff25;background:#0a132be8;backdrop-filter:blur(18px);border-radius:25px}
button,select{border:0;border-radius:20px;background:transparent;color:#f5f5f5;padding:5px 9px;font:inherit;cursor:pointer}
option{background:#0a132b}button:hover{background:#ffffff14}button:focus-visible,select:focus-visible{outline:2px solid #14ffe3}button:disabled{opacity:.3;cursor:default}
#count{color:#b9d1df;padding:0 4px}
</style>
<iframe id="slide" title="Slide do portfólio"></iframe>
<nav aria-label="Navegação do portfólio">
<button id="areas" aria-label="Escolher área">Áreas</button><button id="prev" aria-label="Slide anterior">‹</button>
<select id="index" aria-label="Escolher slide">
<option value="0">01 · Capa</option><option value="1">02 · Dados pessoais</option><option value="2">03 · Perfil profissional</option><option value="3">04 · Objetivos profissionais</option><option value="4">05 · Formação acadêmica</option><option value="5">06 · Formação profissional</option><option value="6">07 · Aulas, cursos e palestras</option><option value="7">08 · Instituições</option><option value="8">09 · Treinadores de futebol</option><option value="9">10 · Executivos de futebol</option><option value="10">11 · Gestão técnica e metodológica</option><option value="11">12 · Desenvolvimento profissional</option><option value="12">13 · Experiência profissional</option><option value="13">14 · Experiência profissional — recente</option><option value="14">15 · Experiência profissional — trajetória</option><option value="15">16 · Títulos e conquistas</option><option value="16">17 · Resumo de conquistas</option><option value="17">18 · Conquistas internacionais</option><option value="18">19 · Conquistas nacionais I</option><option value="19">20 · Conquistas nacionais II</option><option value="20">21 · Conquistas estaduais</option><option value="21">22 · Experiências temporárias</option><option value="22">23 · Visitas técnicas 1</option><option value="23">24 · Visitas técnicas 2</option><option value="24">25 · Visitas técnicas 3</option><option value="25">26 · Visitas técnicas 4</option><option value="26">27 · Visitas técnicas 5</option><option value="27">28 · Jogadores — abertura</option><option value="28">29 · Jogadores I</option><option value="29">30 · Jogadores II</option><option value="30">31 · Jogadores III</option><option value="31">32 · Imprensa — abertura</option><option value="32">33 · Vídeos e matérias</option><option value="33">34 · Redes e contatos</option></select>
<span id="count" aria-live="polite"></span>
<button id="next" aria-label="Próximo slide">›</button>
<select id="language" aria-label="Idioma"><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option></select>
</nav>
<script>
const slides=["../gabriel-capa-trilingue/index.html", "../gabriel-02-dados-pessoais/index.html", "../gabriel-03-perfil-profissional/perfil.html", "../gabriel-03-perfil-profissional/objetivos-teste-claro.html", "../gabriel-05-formacao/index.html", "../gabriel-06-formacao-profissional/index.html", "../gabriel-07-instrutor/index.html", "../gabriel-08-instituicoes/index.html", "../gabriel-09-aulas/index.html", "../gabriel-10-executivos/index.html", "../gabriel-11-gestao-metodologica/index.html", "../gabriel-12-desenvolvimento-profissional/index.html", "../gabriel-13-experiencia/index.html", "../gabriel-14-carreira/index.html", "../gabriel-15-carreira/index.html", "../gabriel-16-titulos/index.html", "../gabriel-resumo-conquistas/index.html", "../gabriel-17-internacionais/index.html", "../gabriel-18-conquistas/index.html", "../gabriel-19-conquistas/index.html", "../gabriel-20-conquistas/index.html", "../gabriel-21-experiencias-temporarias/index.html", "../gabriel-22-visitas/index.html", "../gabriel-23-visitas/index.html", "../gabriel-24-visitas/index.html", "../gabriel-25-visitas/index.html", "../gabriel-26-visitas/index.html", "../gabriel-27-jogadores/index.html", "../gabriel-28-jogadores/index.html", "../gabriel-29-jogadores/index.html", "../gabriel-30-jogadores/index.html", "../gabriel-31-imprensa/index.html", "../gabriel-32-midia/index.html", "../gabriel-33-canais/index.html"];
const frame=document.querySelector('#slide'), picker=document.querySelector('#index'), language=document.querySelector('#language');
let current=0;
function render(){
 const params=new URLSearchParams(location.hash.slice(1));
 current=Math.max(0,Math.min(slides.length-1,Number(params.get('slide')||1)-1));
 const lang=['pt','en','es'].includes(params.get('lang'))?params.get('lang'):'pt';
 picker.value=current;language.value=lang;document.querySelector('#areas').textContent={pt:'Áreas',en:'Sections',es:'Áreas'}[lang];
 if(params.get('view')==='areas'){frame.src='../gabriel-areas/index.html?embedded=1#'+lang;frame.title='Áreas do portfólio';document.querySelector('#count').textContent='';document.querySelector('#prev').disabled=false;document.querySelector('#next').disabled=false;return;}
 frame.src=slides[current]+'?embedded=1#'+lang;
 frame.title=picker.selectedOptions[0].textContent;
 document.querySelector('#count').textContent=(current+1)+' / '+slides.length;
 document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;
}
function go(i){location.hash='slide='+(i+1)+'&lang='+language.value}
picker.addEventListener('change',()=>go(Number(picker.value)));
language.addEventListener('change',()=>{if(new URLSearchParams(location.hash.slice(1)).get('view')==='areas')showAreas();else go(current)});
function showAreas(){location.hash='view=areas&lang='+language.value}
document.querySelector('#areas').addEventListener('click',showAreas);
document.querySelector('#prev').addEventListener('click',()=>go(current-1));
document.querySelector('#next').addEventListener('click',()=>go(current+1));
addEventListener('hashchange',render);
addEventListener('keydown',e=>{if(e.target.matches('select'))return;if(e.key==='ArrowRight'&&current<slides.length-1)go(current+1);if(e.key==='ArrowLeft'&&current>0)go(current-1)});
addEventListener('message',event=>{
 if(event.source!==frame.contentWindow)return;
 if(event.data?.type==='portfolio-menu'){showAreas();return;}
 if(event.data?.type==='portfolio-go'){const n=Number(event.data.slide);if(Number.isInteger(n)&&n>=1&&n<=slides.length)go(n-1);return;}
 if(event.data?.type!=='portfolio-language')return;
 const lang=event.data.language;if(!['pt','en','es'].includes(lang)||lang===language.value)return;
 language.value=lang;if(new URLSearchParams(location.hash.slice(1)).get('view')==='areas')showAreas();else go(current);
});
render();
</script>
</html>
